<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightPulse - Test Visualization Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .test-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            margin: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .test-selector {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .test-case-btn {
            background: linear-gradient(135deg, #f8f9fc 0%, #eaecf4 100%);
            border: 2px solid #e3e6f0;
            border-radius: 10px;
            padding: 15px;
            margin: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .test-case-btn:hover {
            border-color: #4e73df;
            transform: translateY(-2px);
        }

        .test-case-btn.active {
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            color: white;
            border-color: #4e73df;
        }

        .results-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: none;
        }

        .results-section.active {
            display: block;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .metric-card {
            background: linear-gradient(135deg, #f8f9fc 0%, #eaecf4 100%);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin: 10px 0;
            border-left: 4px solid #4e73df;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: #4e73df;
            margin-bottom: 5px;
        }

        .insight-card {
            background: linear-gradient(135deg, #1cc88a 0%, #13855c 100%);
            color: white;
            border-radius: 12px;
            padding: 20px;
            margin: 15px 0;
        }

        .platform-breakdown {
            background: #f8f9fc;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
        }

        .platform-bar {
            background: #e3e6f0;
            height: 25px;
            border-radius: 12px;
            margin: 8px 0;
            position: relative;
            overflow: hidden;
        }

        .platform-fill {
            height: 100%;
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }

        .facebook-fill { background: #1877f2; }
        .instagram-fill { background: #E4405F; }
        .tiktok-fill { background: #000000; }
        .twitter-fill { background: #1DA1F2; }
        .youtube-fill { background: #FF0000; }
        .shopee-fill { background: #EE4D2D; }
        .lazada-fill { background: #0F146D; }

        .chart-container {
            position: relative;
            height: 300px;
            margin: 20px 0;
        }

        .user-type-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .badge-sme { background: #4e73df; color: white; }
        .badge-entrepreneur { background: #1cc88a; color: white; }
        .badge-enterprise { background: #36b9cc; color: white; }
        .badge-researcher { background: #f6c23e; color: white; }
        .badge-student { background: #e74a3b; color: white; }
        .badge-politician { background: #6f42c1; color: white; }
        .badge-government { background: #495057; color: white; }
        .badge-aspiring { background: #ff6b6b; color: white; }

        .demographics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .demo-card {
            background: white;
            border: 1px solid #e3e6f0;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .query-display {
            background: linear-gradient(135deg, #858796 0%, #60616f 100%);
            color: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="display-4 fw-bold text-primary">
                <i class="fas fa-flask"></i> InsightPulse Test Lab
            </h1>
            <p class="lead text-muted">Test 10 Real Analysis Scenarios with Different Visualizations</p>
        </div>

        <!-- Test Case Selector -->
        <div class="test-selector">
            <h4 class="mb-3"><i class="fas fa-list"></i> Select Test Case</h4>
            <div class="row" id="testCaseButtons">
                <!-- Test case buttons will be generated here -->
            </div>
        </div>

        <!-- Results Display -->
        <div id="resultsContainer">
            <!-- Results will be displayed here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Test cases data
        const testCases = [
            {
                id: 1,
                query: "tudung bawal popular di malaysia",
                userType: "sme",
                description: "SME analyzing popular hijab styles",
                results: {
                    brandMentions: 4567,
                    sentiment: 89.2,
                    salesImpact: "RM 67,800",
                    crisisRisk: "Low",
                    insights: {
                        peakTime: "Weekdays 2-4 PM",
                        topRegion: "Selangor (34% mentions)",
                        trendingColors: ["Dusty Pink", "Baby Blue", "Nude"],
                        competitorGap: "Premium segment underserved",
                        revenueOpportunity: "RM 89,000/month potential"
                    },
                    platforms: {
                        facebook: 1823,
                        instagram: 1456,
                        tiktok: 892,
                        shopee: 396
                    },
                    demographics: {
                        age: "25-35 (42%)",
                        location: "Urban areas (67%)",
                        income: "RM 3,000-6,000 (58%)"
                    }
                }
            },
            {
                id: 2,
                query: "harga tudung murah untuk pelajar",
                userType: "student",
                description: "Student researching affordable hijab options",
                results: {
                    brandMentions: 2134,
                    sentiment: 76.8,
                    salesImpact: "RM 12,400",
                    crisisRisk: "Low",
                    insights: {
                        peakTime: "Evenings 7-9 PM",
                        topRegion: "KL & Selangor (45%)",
                        priceRange: "RM 8-25 most popular",
                        studentPreference: "Cotton & Jersey materials",
                        budgetTrend: "Under RM 20 (78% of searches)"
                    },
                    platforms: {
                        tiktok: 856,
                        instagram: 634,
                        facebook: 423,
                        shopee: 221
                    },
                    demographics: {
                        age: "18-24 (71%)",
                        location: "University towns (82%)",
                        income: "Under RM 1,000 (89%)"
                    }
                }
            },
            {
                id: 3,
                query: "trend tudung viral 2025",
                userType: "entrepreneur",
                description: "Entrepreneur tracking viral hijab trends",
                results: {
                    brandMentions: 8923,
                    sentiment: 92.4,
                    salesImpact: "RM 156,700",
                    crisisRisk: "Low",
                    insights: {
                        peakTime: "Weekends 10 AM-12 PM",
                        topRegion: "Nationwide trend",
                        viralFeatures: ["Magnetic clips", "Reversible designs", "Anti-UV"],
                        marketGap: "Tech-integrated hijabs",
                        growthPotential: "347% increase in 6 months"
                    },
                    platforms: {
                        tiktok: 3567,
                        instagram: 2890,
                        facebook: 1678,
                        youtube: 788
                    },
                    demographics: {
                        age: "20-30 (56%)",
                        location: "Urban millennials (73%)",
                        income: "RM 2,500-5,000 (61%)"
                    }
                }
            },
            {
                id: 4,
                query: "sentimen rakyat terhadap dasar hijab di tempat kerja",
                userType: "politician",
                description: "Politician monitoring public opinion on workplace hijab policy",
                results: {
                    brandMentions: 12567,
                    sentiment: 68.3,
                    salesImpact: "N/A",
                    crisisRisk: "Medium",
                    insights: {
                        peakTime: "News cycle dependent",
                        topRegion: "Federal Territory (31%)",
                        publicOpinion: "Mixed reactions (68% support, 32% concerns)",
                        keyIssues: ["Religious freedom", "Workplace equality", "Personal choice"],
                        demographicSplit: "Age-based opinion divide"
                    },
                    platforms: {
                        facebook: 4567,
                        twitter: 3890,
                        instagram: 2456,
                        tiktok: 1654
                    },
                    demographics: {
                        age: "All ages (varied opinions)",
                        location: "Urban vs Rural divide",
                        political: "Party affiliation influences"
                    }
                }
            },
            {
                id: 5,
                query: "analisis pasaran tudung untuk enterprise",
                userType: "enterprise",
                description: "Enterprise conducting comprehensive market analysis",
                results: {
                    brandMentions: 45678,
                    sentiment: 82.7,
                    salesImpact: "RM 2.3M",
                    crisisRisk: "Low",
                    insights: {
                        peakTime: "Business hours analysis",
                        topRegion: "Multi-state coverage",
                        marketSize: "RM 890M annually",
                        growthRate: "12.4% YoY",
                        competitorAnalysis: "15 major players identified"
                    },
                    platforms: {
                        facebook: 18567,
                        instagram: 12890,
                        shopee: 8934,
                        lazada: 5287
                    },
                    demographics: {
                        age: "Comprehensive age groups",
                        location: "National coverage",
                        income: "All income segments"
                    }
                }
            }
        ];

        let currentChart = null;

        function initializeTestCases() {
            const container = document.getElementById('testCaseButtons');
            
            testCases.forEach(testCase => {
                const button = document.createElement('div');
                button.className = 'col-md-6 col-lg-4';
                button.innerHTML = `
                    <div class="test-case-btn" onclick="selectTestCase(${testCase.id})">
                        <div class="user-type-badge badge-${testCase.userType}">
                            ${testCase.userType.toUpperCase()}
                        </div>
                        <h6 class="mb-2">${testCase.query}</h6>
                        <small class="text-muted">${testCase.description}</small>
                    </div>
                `;
                container.appendChild(button);
            });
        }

        function selectTestCase(id) {
            // Update button states
            document.querySelectorAll('.test-case-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.test-case-btn').classList.add('active');

            // Find and display test case
            const testCase = testCases.find(tc => tc.id === id);
            if (testCase) {
                displayResults(testCase);
            }
        }

        function displayResults(testCase) {
            const container = document.getElementById('resultsContainer');
            
            const resultsHTML = `
                <div class="results-section active">
                    <!-- Query Display -->
                    <div class="query-display">
                        <i class="fas fa-search"></i> "${testCase.query}"
                        <div class="user-type-badge badge-${testCase.userType} ms-2">
                            ${testCase.userType.toUpperCase()} PERSPECTIVE
                        </div>
                    </div>

                    <!-- Key Metrics -->
                    <div class="row mb-4">
                        <div class="col-md-3">
                            <div class="metric-card">
                                <div class="metric-value">${testCase.results.brandMentions.toLocaleString()}</div>
                                <div class="h6 text-muted">Brand Mentions</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="metric-card">
                                <div class="metric-value">${testCase.results.sentiment}%</div>
                                <div class="h6 text-muted">Sentiment Score</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="metric-card">
                                <div class="metric-value">${testCase.results.salesImpact}</div>
                                <div class="h6 text-muted">Sales Impact</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="metric-card">
                                <div class="metric-value">${testCase.results.crisisRisk}</div>
                                <div class="h6 text-muted">Crisis Risk</div>
                            </div>
                        </div>
                    </div>

                    <!-- Platform Breakdown -->
                    <div class="platform-breakdown">
                        <h5><i class="fas fa-chart-bar"></i> Platform Distribution</h5>
                        ${Object.entries(testCase.results.platforms).map(([platform, count]) => {
                            const total = Object.values(testCase.results.platforms).reduce((a, b) => a + b, 0);
                            const percentage = ((count / total) * 100).toFixed(1);
                            return `
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="fw-bold">${platform.charAt(0).toUpperCase() + platform.slice(1)}</span>
                                    <span>${count.toLocaleString()} (${percentage}%)</span>
                                </div>
                                <div class="platform-bar">
                                    <div class="${platform}-fill platform-fill" style="width: ${percentage}%">
                                        ${percentage}%
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- AI Insights -->
                    <div class="insight-card">
                        <h5><i class="fas fa-brain"></i> AI-Powered Insights</h5>
                        <div class="row">
                            ${Object.entries(testCase.results.insights).map(([key, value]) => `
                                <div class="col-md-6 mb-2">
                                    <strong>${key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase())}:</strong><br>
                                    ${Array.isArray(value) ? value.join(', ') : value}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Demographics -->
                    <div class="demographics-grid">
                        ${Object.entries(testCase.results.demographics).map(([key, value]) => `
                            <div class="demo-card">
                                <h6>${key.charAt(0).toUpperCase() + key.slice(1)}</h6>
                                <p class="mb-0">${value}</p>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Visualization Chart -->
                    <div class="mt-4">
                        <h5><i class="fas fa-chart-line"></i> Trend Analysis</h5>
                        <div class="chart-container">
                            <canvas id="testChart"></canvas>
                        </div>
                    </div>
                </div>
            `;

            container.innerHTML = resultsHTML;
            
            // Create chart
            setTimeout(() => createTestChart(testCase), 100);
        }

        function createTestChart(testCase) {
            const ctx = document.getElementById('testChart');
            if (!ctx) return;

            // Destroy existing chart
            if (currentChart) {
                currentChart.destroy();
            }

            // Generate sample time series data based on test case
            const labels = ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5', 'Week 6'];
            const baseValue = testCase.results.brandMentions;
            const sentimentValue = testCase.results.sentiment;
            
            // Generate realistic data variations
            const mentionsData = labels.map((_, i) => {
                const variation = (Math.random() - 0.5) * 0.3; // ±15% variation
                return Math.round(baseValue * (1 + variation));
            });

            const sentimentData = labels.map((_, i) => {
                const variation = (Math.random() - 0.5) * 0.2; // ±10% variation
                return Math.max(0, Math.min(100, sentimentValue + (variation * 20)));
            });

            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Brand Mentions',
                            data: mentionsData,
                            borderColor: '#4e73df',
                            backgroundColor: '#4e73df20',
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: 'Sentiment Score (%)',
                            data: sentimentData,
                            borderColor: '#1cc88a',
                            backgroundColor: '#1cc88a20',
                            fill: false,
                            tension: 0.4,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: `${testCase.userType.toUpperCase()} Analysis: ${testCase.query}`,
                            font: { size: 14, weight: 'bold' }
                        },
                        legend: {
                            display: true,
                            position: 'top'
                        }
                    },
                    scales: {
                        x: {
                            display: true,
                            title: {
                                display: true,
                                text: 'Time Period'
                            }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: {
                                display: true,
                                text: 'Mentions Count'
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: {
                                display: true,
                                text: 'Sentiment %'
                            },
                            grid: {
                                drawOnChartArea: false,
                            },
                            min: 0,
                            max: 100
                        }
                    }
                }
            });
        }

        // Initialize on page load
        window.onload = function() {
            initializeTestCases();
            // Auto-select first test case
            setTimeout(() => selectTestCase(1), 500);
        };
    </script>
</body>
</html>
