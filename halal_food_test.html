<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍽️ Halal Food Test - InsightPulse</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .test-button {
            background: #4CAF50;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px;
        }
        .test-button:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        .test-button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
        .results {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            max-height: 600px;
            overflow-y: auto;
        }
        .food-item {
            background: rgba(255, 255, 255, 0.2);
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #4CAF50;
        }
        .platform-tag {
            background: #FF6B6B;
            color: white;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 12px;
            margin-right: 10px;
        }
        .engagement {
            color: #FFD93D;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            color: #ffd43b;
            font-size: 18px;
        }
        .success {
            color: #51cf66;
        }
        .error {
            color: #ff6b6b;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #FFD93D;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍽️ Halal Food Test - InsightPulse</h1>
            <p>Testing: "makanan halal sedap di Kuala Lumpur"</p>
        </div>
        
        <div style="text-align: center;">
            <button class="test-button" onclick="testHalalFood()" id="testBtn">
                🔍 Test Halal Food Search
            </button>
            <button class="test-button" onclick="showRawData()" id="rawBtn">
                📊 Show Raw API Response
            </button>
        </div>
        
        <div id="results" class="results" style="display: none;"></div>
    </div>

    <script>
        let lastApiResponse = null;

        async function testHalalFood() {
            const resultsDiv = document.getElementById('results');
            const testBtn = document.getElementById('testBtn');
            
            // Show loading state
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = '<div class="loading">🔄 Searching for halal food in Kuala Lumpur...</div>';
            testBtn.disabled = true;
            testBtn.textContent = '⏳ Searching...';
            
            try {
                const response = await fetch('http://localhost:8001/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: "makanan halal sedap di Kuala Lumpur",
                        analysis_type: "social_listening",
                        platforms: ["facebook", "instagram"],
                        max_results_per_platform: 20,
                        real_time: true,
                        include_sentiment: true,
                        include_trends: true,
                        malaysian_context: true
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }
                
                const data = await response.json();
                lastApiResponse = data;
                
                // Display results
                displayHalalFoodResults(data);
                
            } catch (error) {
                console.error('Test Error:', error);
                resultsDiv.innerHTML = `<div class="error">❌ ERROR: ${error.message}</div>`;
            } finally {
                testBtn.disabled = false;
                testBtn.textContent = '🔍 Test Halal Food Search';
            }
        }

        function displayHalalFoodResults(data) {
            const resultsDiv = document.getElementById('results');
            
            let html = '<div class="success">✅ HALAL FOOD RESULTS FOUND!</div>';
            
            // Stats
            html += '<div class="stats">';
            html += `<div class="stat-card"><div class="stat-number">${data.total_data_points}</div><div>Total Posts</div></div>`;
            html += `<div class="stat-card"><div class="stat-number">${data.overall_metrics.total_engagement}</div><div>Total Engagement</div></div>`;
            html += `<div class="stat-card"><div class="stat-number">${data.overall_metrics.sentiment_label}</div><div>Overall Sentiment</div></div>`;
            html += `<div class="stat-card"><div class="stat-number">${data.platforms_analyzed.length}</div><div>Platforms</div></div>`;
            html += '</div>';
            
            // Trending topics
            html += '<h3>🔥 Trending Keywords:</h3>';
            html += `<p><strong>${data.overall_metrics.trending_topics.join(', ')}</strong></p>`;
            
            // Platform results
            for (const platform of data.platforms_analyzed) {
                const platformData = data.platform_breakdown[platform];
                if (platformData && platformData.data && platformData.data.length > 0) {
                    html += `<h3>📱 ${platform.toUpperCase()} Results (${platformData.data.length} posts):</h3>`;
                    
                    // Show first 5 posts from each platform
                    for (let i = 0; i < Math.min(5, platformData.data.length); i++) {
                        const post = platformData.data[i];
                        html += `
                            <div class="food-item">
                                <span class="platform-tag">${platform}</span>
                                <span class="engagement">❤️ ${post.total_engagement} engagement</span>
                                <p><strong>📝 Post:</strong> ${post.Text}</p>
                                <p><strong>😊 Sentiment:</strong> ${post.Sentiment} (${(post.sentiment_score * 100).toFixed(1)}%)</p>
                            </div>
                        `;
                    }
                }
            }
            
            resultsDiv.innerHTML = html;
        }

        function showRawData() {
            if (!lastApiResponse) {
                alert('Please run the test first!');
                return;
            }
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <h3>📊 Raw API Response:</h3>
                <pre style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 12px;">
${JSON.stringify(lastApiResponse, null, 2)}
                </pre>
            `;
        }

        // Auto-run test on page load
        window.addEventListener('load', function() {
            setTimeout(() => {
                testHalalFood();
            }, 1000);
        });
    </script>
</body>
</html>
