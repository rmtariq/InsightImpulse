<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; margin: 10px; }
        #result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>InsightPulse API Test</h1>
    
    <button onclick="testAPI()">Test API Connection</button>
    <button onclick="testAnalysis()">Test Analysis</button>
    
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing API connection...';
            
            try {
                const response = await fetch('http://localhost:8001/health');
                const data = await response.json();
                
                resultDiv.innerHTML = `<div class="success">✅ API Connection Success!</div>
                                     <pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ API Connection Failed: ${error.message}</div>`;
                console.error('API test failed:', error);
            }
        }

        async function testAnalysis() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing analysis...';
            
            try {
                const response = await fetch('http://localhost:8001/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: "test query",
                        platforms: ["facebook"],
                        analysis_type: "social_listening",
                        max_results: 10
                    })
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                resultDiv.innerHTML = `<div class="success">✅ Analysis Success!</div>
                                     <p>Query: ${data.query}</p>
                                     <p>Platforms: ${data.platforms_analyzed}</p>
                                     <p>Data Points: ${data.total_data_points}</p>
                                     <p>Sentiment: ${data.overall_metrics.sentiment_label}</p>`;
                                     
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Analysis Failed: ${error.message}</div>
                                     <p>Check console for details</p>`;
                console.error('Analysis test failed:', error);
                console.error('Error stack:', error.stack);
            }
        }
    </script>
</body>
</html>
